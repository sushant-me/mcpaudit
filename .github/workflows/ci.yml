name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The integration tests load a generated policy with the real loader. Pinned to a
      # commit so this repository does not go red because another one moved.
      #
      # The pin is advanced deliberately, not left where it was. This one sat on a commit
      # from before policygate v0.1.1, which fixed a glob rule that a newline could step
      # around - so the integration here was validating a policy loader whose deny rules
      # were bypassable, and would have reported success for exactly the behaviour that fix
      # exists to stop.
      - name: Install policygate at the pinned commit
        run: pip install "git+https://github.com/sushant-me/policygate@73b3da28ede820d3f3452b408e040fb1b1c78c14"
      - name: Tests
        run: pytest -q tests/
      - name: The generated policy loads in policygate
        run: 'python3 -c "import policygate; print(policygate.__version__)"'
      - name: The pipeline demo runs end to end
        run: 'python3 examples/pipeline.py | grep -q "not allowed just because it is new"' 
      - name: A well-behaved server is silent and exits zero
        # Quoted as a whole: a plain YAML scalar containing ": " parses as a mapping, and
        # GitHub reports that only as "likely failed because of a workflow file issue".
        run: 'python3 -m mcpaudit.cli audit examples/tools_clean.json --no-colour | grep -q "no findings"'
      - name: A poisoned server fails the default threshold
        run: 'python3 -m mcpaudit.cli audit examples/tools_poisoned.json --no-colour || test $? -eq 1'
      - name: The hidden tag-block payload is decoded
        run: 'python3 -m mcpaudit.cli audit examples/tools_poisoned.json --json | grep -q "do not tell the user"'
      - name: Report-only mode exits zero and still prints the findings
        run: |
          python3 -m mcpaudit.cli audit examples/tools_poisoned.json --no-colour --fail-on none > /tmp/report.txt
          grep -q CRITICAL /tmp/report.txt
      - name: Drift against a lock file is detected
        run: |
          python3 -m mcpaudit.cli audit examples/tools_clean.json --write-lock /tmp/lock.json --no-colour
          python3 -m mcpaudit.cli audit examples/tools_clean.json --lock /tmp/lock.json --no-colour

  # The action is how most people will actually run this, so it is tested the way they
  # will: `uses: ./` against the two fixtures — a pass for the clean server, and a
  # failed job (with the count and worst severity still exported) for the poisoned one.
  action-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          source: examples/tools_clean.json

  action-poisoned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: audit
        uses: ./
        continue-on-error: true
        with:
          source: examples/tools_poisoned.json
      - name: The action failed the job for a poisoned server
        run: test "${{ steps.audit.outcome }}" = "failure"
      - name: The action still exported the count and the worst severity
        run: |
          test "${{ steps.audit.outputs.findings }}" -gt 0
          test "${{ steps.audit.outputs.worst }}" = "critical"
